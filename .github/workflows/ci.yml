
name: Basic CI Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pytest
        run: python -m pip install pytest

      - name: Run Tests
        run: python -m pytest -v
